[package]
name = "capture-viewer"
version = "0.1.0"
edition = "2021"
description = "Full-screen 16:9 capture card viewer — Rust + WebAssembly PWA"

[dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
features = [
  "Document", "Element", "Event", "EventTarget", "HtmlElement", "HtmlOptionElement",
  "HtmlSelectElement", "HtmlVideoElement", "KeyboardEvent", "MediaDeviceInfo",
  "MediaDeviceKind", "MediaDevices", "MediaStream", "MediaStreamConstraints",
  "MediaStreamTrack", "MediaTrackSettings", "Navigator", "NodeList", "DomTokenList", "Permissions",
  "PermissionState", "PermissionStatus", "ServiceWorkerContainer", "Storage", "Window",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
