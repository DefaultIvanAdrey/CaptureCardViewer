<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2021" id="themeColorMeta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Capture Viewer" />
    <title>Capture Viewer · 16:9</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@400;600;700&display=swap" />

    <link data-trunk rel="css" href="style.css" />
    <link data-trunk rel="icon" href="public/icon.svg" />
    <link data-trunk rel="copy-file" href="public/manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="public/sw.js" />
    <link data-trunk rel="copy-file" href="public/icon-192.png" />
    <link data-trunk rel="copy-file" href="public/icon-512.png" />
    <link data-trunk rel="copy-file" href="public/icon-maskable-512.png" />
    <link data-trunk rel="copy-file" href="public/apple-touch-icon.png" />
    <link data-trunk rel="rust" data-wasm-opt="z" />
</head>
<body data-theme="gruvbox">

    <div id="app">

        <header class="app-header">
            <div class="logo">⬡</div>
            <h1>Capture Viewer</h1>
            <div class="header-right">
                <span class="status-badge" role="status" aria-live="polite">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusLabel">Ready</span>
                    <span class="status-detail" id="statusDetail"></span>
                </span>
                <button class="theme-chip selected" data-t="gruvbox" type="button">Gruv</button>
                <button class="theme-chip" data-t="charcoal" type="button">Char</button>
            </div>
        </header>

        <div class="video-wrap" id="videoWrap">
            <video id="vid" autoplay playsinline muted disablepictureinpicture disableremoteplayback></video>

            <div id="noSignal">
                <div class="ns-icon">📷</div>
                <p>NO SIGNAL</p>
            </div>

            <div id="startOverlay">
                <div class="big-icon">🎮</div>
                <h2>Start Capture</h2>
                <p>click anywhere or press the button</p>
                <button class="start-btn" id="startBtn" type="button">▶&nbsp; Start</button>
            </div>

            <div id="errorToast" role="alert"></div>
        </div>

        <div class="controls-bar" id="controlsBar">
            <div class="ctrl-group">
                <label for="videoInSel" title="Video input">📹</label>
                <select id="videoInSel"><option value="">Auto</option></select>
            </div>

            <div class="ctrl-group">
                <label for="resSel" title="Resolution">📐</label>
                <select id="resSel">
                    <option value="3840x2160">4K (3840×2160)</option>
                    <option value="2560x1440">1440p (2560×1440)</option>
                    <option value="1920x1080" selected>1080p</option>
                    <option value="1280x720">720p</option>
                    <option value="854x480">480p</option>
                    <option value="2560x1600">2560×1600</option>
                    <option value="1920x1200">1920×1200</option>
                    <option value="1680x1050">1680×1050</option>
                    <option value="1440x900">1440×900</option>
                    <option value="1280x800">1280×800</option>
                </select>
            </div>

            <div class="ctrl-group actions">
                <button class="btn primary" id="restartBtn" type="button" title="Restart capture">↻</button>
                <button class="btn fs-btn" id="fsBtn" type="button" title="Fullscreen (F)">⛶</button>
            </div>
        </div>
    </div>

    <div id="pwaToast">
        <span>Install as app?</span>
        <div class="toast-btns">
            <button class="btn primary" id="pwaInstallConfirm" type="button">Install</button>
            <button class="btn" id="pwaInstallDismiss" type="button">Later</button>
        </div>
    </div>

</body>
</html>
